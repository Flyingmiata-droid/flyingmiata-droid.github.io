<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RigBrain — AI Equipment Advisor for Contractors</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #0a0a0a;
      color: #e0e0e0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 2rem;
    }
    .logo {
      font-size: 3.5rem;
      font-weight: 800;
      letter-spacing: -0.02em;
      margin-bottom: 0.5rem;
    }
    .logo span:first-child { color: #f59e0b; }
    .logo span:last-child { color: #ffffff; }
    .tagline {
      font-size: 1.25rem;
      color: #9ca3af;
      margin-bottom: 2.5rem;
      max-width: 500px;
    }
    .cta {
      display: inline-block;
      background: #f59e0b;
      color: #0a0a0a;
      font-size: 1.1rem;
      font-weight: 700;
      padding: 0.85rem 2.2rem;
      border-radius: 8px;
      text-decoration: none;
      transition: background 0.2s;
      margin-bottom: 1.5rem;
    }
    .cta:hover { background: #d97706; }
    .sub {
      font-size: 0.9rem;
      color: #6b7280;
    }
    .sub a { color: #f59e0b; text-decoration: none; }
    .sub a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <div class="logo"><span>Rig</span><span>Brain</span></div>
  <p class="tagline">The AI-powered equipment advisor that helps contractors pick the right gear for every job.</p>
  <a class="cta" href="mailto:jim@rigbrain.io">Get Early Access</a>
  <p class="sub">Questions? Reach out at <a href="mailto:jim@rigbrain.io">jim@rigbrain.io</a></p>
</body>
</html>
