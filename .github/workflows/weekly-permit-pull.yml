# RigBrain — Weekly permit pull + sample report regeneration
# Drops fresh Austin permit data + a regenerated sample_lead_report.html/pdf
# into the repo every Monday at 6am Central (12:00 UTC).
#
# Where this file goes:
#   .github/workflows/weekly-permit-pull.yml
#   (in the Flyingmiata-droid/flyingmiata-droid.github.io repo)
#
# What it commits to the repo:
#   out/austin_permits_YYYYMMDD.{csv,json}
#   out/austin_permits_latest.{csv,json}    (symlink-style copy for stable URL)
#   out/sample_lead_report.html             (overwrites — always latest)
#   out/sample_lead_report.pdf              (overwrites — always latest)
#
# After deployment the latest report is publicly viewable at:
#   https://rigbrain.io/out/sample_lead_report.html

name: Weekly permit pull

on:
  schedule:
    # Mondays at 12:00 UTC = 6:00 am Central (during DST) / 7:00 am Central (standard)
    - cron: '0 12 * * 1'
  workflow_dispatch:    # lets you trigger manually from the Actions tab

permissions:
  contents: write    # needed for the action to commit back to the repo

jobs:
  pull-and-report:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install system deps for weasyprint
        run: |
          sudo apt-get update
          sudo apt-get install -y libpango-1.0-0 libpangoft2-1.0-0

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install weasyprint

      - name: Pull latest Austin permits and generate report
        run: |
          mkdir -p out
          python scripts/weekly_run.py --days 60 --min-value 1000000

      - name: Copy timestamped output to "latest" for stable URL
        run: |
          cp out/austin_permits_*.csv  out/austin_permits_latest.csv  || true
          cp out/austin_permits_*.json out/austin_permits_latest.json || true

      - name: Commit regenerated files
        run: |
          git config user.name  "rigbrain-bot"
          git config user.email "bot@rigbrain.io"
          git add out/
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Auto: weekly permit pull $(date -u +%Y-%m-%d)"
            git push
          fi
